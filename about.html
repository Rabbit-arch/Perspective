<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Catatan pelan tentang jarak, sudut, dan siapa yang sedang memandang siapa.">
<meta name="theme-color" content="#0a0a0c">
<title>⌈ PERSPECTIVE ⌋ — About Me</title>
<style>
@font-face{font-family:'Liberation Mono';src:url('fonts/LiberationMono-Regular.ttf') format('truetype');font-weight:normal;font-style:normal;}
:root{--bg:#0a0a0c;--fg:#b9b9c4;--dim:#6c6c7a;--ac:#c0262d;--ln:#2a2a33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body,*{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
img,svg,video{-webkit-user-drag:none;user-drag:none}
::selection{background:transparent;color:inherit}
html,body{overflow-x:hidden}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 "Liberation Mono","Courier New",Courier,monospace;
background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);animation:bgp 4s ease-in-out infinite}
@keyframes bgp{0%,100%{background-color:#0a0a0c}50%{background-color:#14080a}}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 40%,rgba(192,38,45,.35),rgba(192,38,45,.08) 60%,transparent 80%);opacity:0;animation:bl 3.5s steps(1) infinite}
@keyframes bl{0%{opacity:0}6%{opacity:1}8%{opacity:0}10%{opacity:.8}12%{opacity:0}48%{opacity:0}50%{opacity:1}53%{opacity:.2}56%{opacity:.9}60%{opacity:0}100%{opacity:0}}
body::after{content:"";position:fixed;inset:-10%;pointer-events:none;z-index:0;opacity:.07;background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/3px 3px,repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 5px);mix-blend-mode:screen}
h1,.eq,.sub,.subt{animation:gl 3.5s steps(1) infinite}
@keyframes gl{0%,5%,8%,9%,12%,49%,60%,100%{text-shadow:none}6%,10%{text-shadow:0 0 8px #ff2a35,0 0 22px #ff2a35,3px 0 #ff2a35,-3px 0 #5ff;color:#fff}50%,56%{text-shadow:0 0 10px #ff2a35,0 0 30px #ff2a35;color:#fff}53%{text-shadow:none}}
article h2,article p,article h3,nav,#st{animation:gl2 3.5s steps(1) infinite}
@keyframes gl2{0%,5%,8%,9%,12%,49%,60%,100%{text-shadow:none}6%,10%{text-shadow:1px 0 rgba(255,42,53,.7),-1px 0 rgba(85,255,255,.35)}50%,56%{text-shadow:0 0 6px rgba(255,42,53,.45)}53%{text-shadow:none}}
body{transition:background-color .4s}
a{color:var(--fg);text-decoration:none;border-bottom:1px dotted var(--dim)}
a:hover{color:#fff;background:var(--ac);border-color:var(--ac)}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:28px 18px 60px;text-align:center}
h1{font-family:Times,"Times New Roman",serif;font-size:clamp(18px,5vw,26px);letter-spacing:.45em;margin:10px 0;font-weight:normal;-webkit-font-smoothing:none;font-smooth:never}
.subt{color:var(--dim);font-size:12px;letter-spacing:.2em;margin:0 0 8px}
.sub{color:var(--ac);font-size:12px;letter-spacing:.2em}
.eq{color:var(--dim);white-space:nowrap;font-size:18px;letter-spacing:2px}
nav{margin:14px 0;font-size:14px;line-height:2.2}
nav span{color:var(--dim);margin:0 6px}
hr{border:0;border-top:1px solid var(--ln);margin:22px 0}
button{font:inherit;background:none;color:var(--fg);border:1px solid var(--dim);padding:2px 12px;cursor:pointer}
button:hover{background:var(--ac);border-color:var(--ac);color:#fff}
article{margin:44px 0;text-align:left}
article h2{font-size:20px;font-weight:400;margin:0;text-align:center;letter-spacing:.05em}
article h3{font-size:12px;font-weight:400;color:var(--dim);text-align:center;margin:4px 0}
article hr{margin:12px 0 18px}
article p{margin:0 0 12px}
.cen{text-align:center}
footer{color:var(--dim);font-size:12px;margin-top:50px}
[hidden]{display:none!important}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
nav a[aria-current="page"]{color:#fff;border-bottom:1px solid var(--ac)}
@media (prefers-reduced-motion:reduce){
body,body::before,h1,.eq,.sub,.subt,article h2,article p,article h3,nav,#st{animation:none!important}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stz{margin:24px 0;text-align:center;line-height:1.9}
.stz [data-fw]{margin:0;font-size:14px;letter-spacing:.04em;overflow-wrap:anywhere}
.stz [data-fw]:first-child{color:#fff}
.stz [data-fw]:last-child{color:var(--dim)}
.dia{text-align:center;color:var(--ac);font-size:18px;margin:28px 0 14px}
</style>
</head>
<body>
<main>
<h1 id="ttl">⌈ ABOUT ME ⌋</h1>
<hr>

<article>
</article>


</main>
<script>
(function(){
function convert(s){var o='';for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);o+=c===32?'\u3000':(c>32&&c<127)?String.fromCharCode(c+0xFEE0):s.charAt(i)}return o}
function apply(root){(root||document).querySelectorAll('[data-fw]').forEach(function(el){
if(el.querySelector('.sr'))return;
var t=el.textContent.trim(),a=document.createElement('span'),b=document.createElement('span');
a.setAttribute('aria-hidden','true');a.textContent=convert(t);b.className='sr';b.textContent=t;
el.textContent='';el.appendChild(a);el.appendChild(b)})}
window.Fullwidth={convert:convert,apply:apply};apply();
})();
</script>
</body>
</html>
