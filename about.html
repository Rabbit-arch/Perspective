  <style>
    /* ==========================================================================
       Font Faces
       ========================================================================== */
    @font-face {
      font-family: 'LiterationMono Nerd Font';
      src: url('assets/fonts/LiterationMonoNerdFont-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'Liberation Serif';
      src: url('assets/fonts/LiberationSerif-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    /* ==========================================================================
       CSS Variables & Global Reset
       ========================================================================== */
    :root {
      --bg: #0a0a0c;
      --fg: #b9b9c4;
      --dim: #6c6c7a;
      --ac: #c0262d;
      --ln: #2a2a33;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    img,
    svg,
    video {
      -webkit-user-drag: none;
      user-drag: none;
    }

    ::selection {
      background: transparent;
      color: inherit;
    }

    html,
    body {
      overflow-x: hidden;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    /* ==========================================================================
       Body & Ambient Effects (Pulse, Scanlines, Noise)
       ========================================================================== */
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.7 "LiterationMono Nerd Font", "Courier New", Courier, monospace;
      background-image: repeating-linear-gradient(0deg, rgba(255, 255, 255, .03) 0 1px, transparent 1px 3px);
      animation: bgp 4s ease-in-out infinite;
      transition: background-color .4s;
    }

    @keyframes bgp {
      0%, 100% {
        background-color: #0a0a0c;
      }
      50% {
        background-color: #14080a;
      }
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(192, 38, 45, .35), rgba(192, 38, 45, .08) 60%, transparent 80%);
      opacity: 0;
      animation: bl 3.5s steps(1) infinite;
    }

    @keyframes bl {
      0% { opacity: 0; }
      6% { opacity: 1; }
      8% { opacity: 0; }
      10% { opacity: .8; }
      12% { opacity: 0; }
      48% { opacity: 0; }
      50% { opacity: 1; }
      53% { opacity: .2; }
      56% { opacity: .9; }
      60% { opacity: 0; }
      100% { opacity: 0; }
    }

    body::after {
      content: "";
      position: fixed;
      inset: -10%;
      pointer-events: none;
      z-index: 0;
      opacity: .07;
      background: repeating-conic-gradient(#fff 0 25%, #000 0 50%) 0 0/3px 3px,
                  repeating-linear-gradient(90deg, #fff 0 1px, transparent 1px 5px);
      mix-blend-mode: screen;
    }

    /* ==========================================================================
       Glitch Text Animation
       ========================================================================== */
    h1,
    .eq,
    .sub,
    .subt {
      animation: gl 3.5s steps(1) infinite;
    }

    @keyframes gl {
      0%, 5%, 8%, 9%, 12%, 49%, 60%, 100% {
        text-shadow: none;
      }
      6%, 10% {
        text-shadow: 0 0 8px #ff2a35, 0 0 22px #ff2a35, 3px 0 #ff2a35, -3px 0 #5ff;
        color: #fff;
      }
      50%, 56% {
        text-shadow: 0 0 10px #ff2a35, 0 0 30px #ff2a35;
        color: #fff;
      }
      53% {
        text-shadow: none;
      }
    }

    article h2,
    article p,
    article h3,
    nav,
    #st {
      animation: gl2 3.5s steps(1) infinite;
    }

    @keyframes gl2 {
      0%, 5%, 8%, 9%, 12%, 49%, 60%, 100% {
        text-shadow: none;
      }
      6%, 10% {
        text-shadow: 1px 0 rgba(255, 42, 53, .7), -1px 0 rgba(85, 255, 255, .35);
      }
      50%, 56% {
        text-shadow: 0 0 6px rgba(255, 42, 53, .45);
      }
      53% {
        text-shadow: none;
      }
    }

    /* ==========================================================================
       Typography & Header Hierarchy
       ========================================================================== */
    h1, h2, h3, h4, h5, h6,
    article h2, article h3 {
      font-family: 'Liberation Serif', serif;
      font-weight: normal;
    }

    h1 {
      font-size: clamp(18px, 5vw, 26px);
      letter-spacing: .45em;
      margin: 10px 0;
      -webkit-font-smoothing: none;
      font-smooth: never;
    }

    #st,
    .sub,
    .subt,
    [role="status"],
    .status {
      font-family: 'Liberation Serif', serif;
    }

    .subt {
      color: var(--dim);
      font-size: 12px;
      letter-spacing: .2em;
      margin: 0 0 8px;
    }

    .sub {
      color: var(--ac);
      font-size: 12px;
      letter-spacing: .2em;
    }

    .eq {
      color: var(--dim);
      white-space: nowrap;
      font-size: 18px;
      letter-spacing: 2px;
    }

    /* ==========================================================================
       Interactive Links & Navigation
       ========================================================================== */
    a {
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px dotted var(--dim);
    }

    a:hover {
      color: #fff;
      background: var(--ac);
      border-color: var(--ac);
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
      padding: 28px 18px 60px;
      text-align: center;
    }

    nav {
      margin: 14px 0;
      font-size: 14px;
      line-height: 2.2;
    }

    nav span {
      color: var(--dim);
      margin: 0 6px;
    }

    nav a[aria-current="page"] {
      color: #fff;
      border-bottom: 1px solid var(--ac);
    }

    hr {
      border: 0;
      border-top: 1px solid var(--ln);
      margin: 22px 0;
    }

    button {
      font: inherit;
      background: none;
      color: var(--fg);
      border: 1px solid var(--dim);
      padding: 2px 12px;
      cursor: pointer;
    }

    button:hover {
      background: var(--ac);
      border-color: var(--ac);
      color: #fff;
    }

    /* ==========================================================================
       Article & Poetry Stanzas
       ========================================================================== */
    article {
      margin: 44px 0;
      text-align: left;
    }

    article h2 {
      font-size: 20px;
      font-weight: 400;
      margin: 0;
      text-align: center;
      letter-spacing: .05em;
    }

    article h3 {
      font-size: 12px;
      font-weight: 400;
      color: var(--dim);
      text-align: center;
      margin: 4px 0;
    }

    article hr {
      margin: 12px 0 18px;
    }

    article p {
      margin: 0 0 12px;
    }

    .cen {
      text-align: center;
    }

    .stz {
      margin: 24px 0;
      text-align: center;
      line-height: 1.9;
    }

    .stz [data-fw] {
      margin: 0;
      font-size: 14px;
      letter-spacing: .04em;
      overflow-wrap: anywhere;
    }

    .stz [data-fw]:first-child {
      color: #fff;
    }

    .stz [data-fw]:last-child {
      color: var(--dim);
    }

    .dia {
      text-align: center;
      color: var(--ac);
      font-size: 18px;
      margin: 28px 0 14px;
    }

    /* ==========================================================================
       Portrait Sub Header & Mini Eye (gambar di atas, mata di bawahnya
       dekat garis; lebar mata = 1/3 lebar gambar; tanpa frame)
       ========================================================================== */
    .pfw {
      width: 300px;
      max-width: 100%;
      margin: 18px auto 0;
    }

    .dith {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      object-fit: cover;
    }

    #eye {
      color: #ff2a35;
      display: block;
      width: calc(100% / 3);
      aspect-ratio: 1;
      margin: 6px auto 0;
      overflow: visible;
      background: none;
      pointer-events: none;
    }

    .pfw + hr {
      margin-top: 8px;
    }

    /* ==========================================================================
       Footer & Utility Classes
       ========================================================================== */
    footer {
      color: var(--dim);
      font-size: 12px;
      margin-top: 50px;
    }

    [hidden] {
      display: none !important;
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--ac);
      outline-offset: 2px;
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
      body,
      body::before,
      h1,
      .eq,
      .sub,
      .subt,
      article h2,
      article p,
      article h3,
      nav,
      #st {
        animation: none !important;
      }
    }
  </style>
</head>

  <script>
    /* ==========================================================================
       Fullwidth Utility
       ========================================================================== */
    (function() {
      function convert(s) {
        var o = '';
        for (var i = 0; i < s.length; i++) {
          var c = s.charCodeAt(i);
          o += c === 32 ? '\u3000' : (c > 32 && c < 127) ? String.fromCharCode(c + 0xFEE0) : s.charAt(i);
        }
        return o;
      }

      function apply(root) {
        (root || document).querySelectorAll('[data-fw]').forEach(function(el) {
          if (el.querySelector('.sr')) return;
          var t = el.textContent.trim();
          var a = document.createElement('span');
          var b = document.createElement('span');
          a.setAttribute('aria-hidden', 'true');
          a.textContent = convert(t);
          b.className = 'sr';
          b.textContent = t;
          el.textContent = '';
          el.appendChild(a);
          el.appendChild(b);
        });
      }

      window.Fullwidth = { convert: convert, apply: apply };
      apply();
    })();
  </script>

  <script>
    /* ==========================================================================
       Mini Eye: pointer tracking + logika mata (follow / stare / blink)
       ========================================================================== */
    var P = { x: null, y: null, t: 0 };

    addEventListener('pointermove', function(e) {
      P.x = e.clientX;
      P.y = e.clientY;
      P.t = performance.now();
    }, { passive: true });

    addEventListener('touchmove', function(e) {
      var t = e.touches[0];
      if (t) {
        P.x = t.clientX;
        P.y = t.clientY;
        P.t = performance.now();
      }
    }, { passive: true });

    var E = {
      on: false,
      mode: 'follow',
      x: 0,
      y: 0,
      tx: 0,
      ty: 0,
      open: 1,
      top: 1,
      pup: 18,
      til: 0,
      raf: 0,
      blink: 0,
      sac: 0
    };

    var holeEl = document.getElementById('hole');
    var eyeEl = document.getElementById('eye');
    var irisEl = document.getElementById('iris');
    var irs2 = document.getElementById('irs2');
    var pupEl = document.getElementById('pup');
    var lidsEl = document.getElementById('lids');

    function rnd(a, b) {
      return a + Math.random() * (b - a);
    }

    var starePhase = rnd(280, 480);

    function cycle() {
      if (!E.on) return;
      if (E.mode === 'follow') {
        if (Math.random() < rnd(.35, .75)) {
          E.mode = 'stare';
          starePhase = rnd(250, 500);
          setTimeout(cycle, rnd(2500, 7500));
        } else {
          setTimeout(cycle, rnd(5000, 14000));
        }
      } else {
        E.mode = 'follow';
        setTimeout(cycle, rnd(5000, 14000));
      }
    }

    function blinkLoop() {
      if (!E.on) return;
      if (E.mode === 'follow' || Math.random() < .25) {
        E.blink = performance.now();
      }
      setTimeout(blinkLoop, rnd(1800, 5500));
    }

    function frame(now) {
      if (!E.on) return;
      var r = eyeEl.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      var cy = r.top + r.height / 2;
      var k = r.width / 300;
      var idle = P.x === null || now - P.t > 4000;
      var tx = 0;
      var ty = 0;
      var stare = E.mode === 'stare';

      if (stare) {
        tx = 0;
        ty = 0;
      } else if (idle) {
        if (now > E.sac) {
          E.sac = now + rnd(900, 2600);
          E.wx = rnd(-1, 1);
          E.wy = rnd(-.5, .5);
        }
        tx = E.wx * 44;
        ty = E.wy * 16;
      } else {
        var dx = P.x - cx;
        var dy = P.y - cy;
        var d = Math.hypot(dx, dy) || 1;
        var m = Math.min(d / (160 * k + 1), 1);
        tx = dx / d * m * 44;
        ty = dy / d * m * 17;
      }

      var f = stare ? .07 : .2;
      E.x += (tx - E.x) * f;
      E.y += (ty - E.y) * f;

      var jx = stare ? Math.sin(now / 37) * .7 : 0;
      var jy = stare ? Math.cos(now / 43) * .5 : 0;

      irisEl.setAttribute('transform', 'translate(' + (150 + E.x + jx).toFixed(2) + ',' + (150 + E.y + jy).toFixed(2) + ')');

      var psc = stare ? 1.07 : 1;
      irs2.setAttribute('transform', 'scale(' + psc + ')');
      holeEl.setAttribute('cx', (150 + E.x + jx).toFixed(2));
      holeEl.setAttribute('cy', (150 + E.y + jy).toFixed(2));
      holeEl.setAttribute('r', (52 * psc).toFixed(2));

      var tp = stare ? 11 : (idle ? 26 : 24 + Math.min(Math.hypot(P.x - cx, P.y - cy) / 200, 1) * 3);
      E.pup += (tp - E.pup) * (stare ? .04 : .15);
      pupEl.setAttribute('r', E.pup.toFixed(2));

      var to = stare ? 1.14 : 1;
      E.open += (to - E.open) * .06;

      var b = now - E.blink;
      var bl = b < 160 ? 1 - Math.sin(b / 160 * Math.PI) * .92 : 1;

      lidsEl.setAttribute('transform', 'translate(0,150) scale(1,' + (E.open * bl).toFixed(3) + ') translate(0,-150)');
      E.raf = requestAnimationFrame(frame);
    }

    function eyeStart() {
      if (E.on) return;
      E.on = true;
      E.mode = 'follow';
      E.blink = 0;
      setTimeout(cycle, rnd(800, 3200));
      setTimeout(blinkLoop, rnd(1000, 3000));
      E.raf = requestAnimationFrame(frame);
    }

    /* prefers-reduced-motion: mata statis (tanpa loop animasi) */
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      eyeStart();
    }
  </script>

    document.addEventListener('contextmenu', function(e) {

        (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key)) ||
        (e.ctrlKey && e.key === 'U')
      ) {
