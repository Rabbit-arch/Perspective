<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Halaman arsip sedang dalam pengerjaan.">
<meta name="theme-color" content="#0a0a0c">
<title>⌈ PERSPECTIVE ⌋ — Archive</title>
<style>
@font-face{font-family:'LiterationMono Nerd Font';src:url('fonts/LiterationMonoNerdFont-Regular.ttf') format('truetype');font-weight:normal;font-style:normal;}
@font-face{font-family:'Liberation Serif';src:url('fonts/LiberationSerif-Regular.ttf') format('truetype');font-weight:normal;font-style:normal;}
:root{--bg:#0a0a0c;--fg:#b9b9c4;--dim:#6c6c7a;--ac:#c0262d;--ln:#2a2a33}
*{box-sizing:border-box}
html,body{overflow-x:hidden;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.7 "LiterationMono Nerd Font","Courier New",Courier,monospace;
background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);
animation:bgp 4s ease-in-out infinite}
@keyframes bgp{0%,100%{background-color:#0a0a0c}50%{background-color:#14080a}}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
background:radial-gradient(ellipse at 50% 40%,rgba(192,38,45,.35),rgba(192,38,45,.08) 60%,transparent 80%);
opacity:0;animation:bl 3.5s steps(1) infinite}
@keyframes bl{0%{opacity:0}6%{opacity:1}8%{opacity:0}10%{opacity:.8}12%{opacity:0}48%{opacity:0}50%{opacity:1}53%{opacity:.2}56%{opacity:.9}60%{opacity:0}100%{opacity:0}}
body::after{content:"";position:fixed;inset:-10%;pointer-events:none;z-index:0;opacity:.07;
background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/3px 3px,
repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 5px);mix-blend-mode:screen}
h1{font-family:'Liberation Serif',serif;font-size:clamp(18px,5vw,26px);letter-spacing:.45em;margin:10px 0;font-weight:normal;-webkit-font-smoothing:none;font-smooth:never;
animation:gl 3.5s steps(1) infinite}
@keyframes gl{0%,5%,8%,9%,12%,49%,60%,100%{text-shadow:none}
6%,10%{text-shadow:0 0 8px #ff2a35,0 0 22px #ff2a35,3px 0 #ff2a35,-3px 0 #5ff;color:#fff}
50%,56%{text-shadow:0 0 10px #ff2a35,0 0 30px #ff2a35;color:#fff}53%{text-shadow:none}}
.eq{color:var(--dim);white-space:nowrap;font-size:18px;letter-spacing:2px;
animation:gl 3.5s steps(1) infinite}
a{color:var(--fg);text-decoration:none;border-bottom:1px dotted var(--dim)}
a:hover{color:#fff;background:var(--ac);border-color:var(--ac)}
a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:28px 18px 60px;text-align:center}
nav{margin:14px 0;font-size:14px;line-height:2.2}
nav span{color:var(--dim);margin:0 6px}
nav a[aria-current="page"]{color:#fff;border-bottom:1px solid var(--ac)}
hr{border:0;border-top:1px solid var(--ln);margin:22px 0}
article{margin:44px 0;text-align:center}
.notice-box{
  display:inline-block;
  margin:32px auto;
  padding:28px 32px;
  border:1px solid var(--ln);
  text-align:center;
  position:relative;
}
.notice-box::before,
.notice-box::after{
  content:"";
  position:absolute;
  background:#fff;
}
.notice-box::before{
  top:6px;left:6px;right:6px;height:1px;
}
.notice-box::after{
  bottom:6px;left:6px;right:6px;height:1px;
}
.notice-tag{
  font-size:11px;
  letter-spacing:.25em;
  color:var(--dim);
  text-transform:uppercase;
  margin:0 0 14px;
}
.notice-code{
  font-size:clamp(32px,10vw,52px);
  font-weight:400;
  color:var(--ac);
  letter-spacing:.08em;
  margin:0 0 8px;
  line-height:1;
  animation:gl 3.5s steps(1) infinite;
}
.notice-title{
  font-size:14px;
  color:var(--fg);
  letter-spacing:.12em;
  margin:0 0 20px;
}
.notice-body{
  font-size:13px;
  color:var(--dim);
  line-height:1.9;
  max-width:28em;
  margin:0 auto;
}
.notice-body strong{
  color:var(--fg);
  font-weight:400;
}
.dot{
  display:inline-block;
  width:6px;height:6px;
  background:var(--ac);
  border-radius:50%;
  margin:0 4px;
  vertical-align:middle;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
footer{color:var(--dim);font-size:12px;margin-top:50px}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){
  body,body::before,h1,.eq,.notice-code,.dot{animation:none!important}
}
</style>
</head>
<body>
  <main>
    <h1 id="ttl">⌈ ARCHIVE ⌋</h1>
    <hr>
    <article>
      <div class="notice-box">
        <p class="notice-tag">— status —</p>
        <p class="notice-code">503</p>
        <p class="notice-title">HALAMAN BELUM TERSEDIA</p>
        <p class="notice-body">
          Konten arsip sedang <strong>disiapkan</strong>.<br>
          Akan diperbarui sewaktu-waktu.<br><br>
          <span class="dot"></span> dalam pengerjaan
        </p>
      </div>
    </article>
    <hr>
    <footer>© 2026 ︱ <a href="mailto:raihanhmubarak@gmail.com">contact</a></footer>
  </main>
</body>
</html>
